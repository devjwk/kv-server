<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" role="img" aria-label="MINI-KV SERVER">
<title>MINI-KV SERVER</title>
<style>
.kick{font:700 15px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:3px;fill:#4ADE80}
.title{font:800 56px system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:1.5px;fill:#ffffff}
.tag{font:500 21px system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#ffffff;opacity:.86}
.m{font:500 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace} .mb{font:700 14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace} .mbig{font:800 20px system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif} .big{font:800 30px system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif} .term{font:500 15px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.bar{fill:#4ADE80}
@keyframes blink{50%{opacity:0}} .cur{animation:blink 1s steps(1) infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#020617"/><stop offset="1" stop-color="#052E16"/></linearGradient></defs>
<rect width="1200" height="280" rx="20" fill="url(#g)"/>
<rect class="bar" x="64" y="62" width="44" height="5" rx="2.5"/>
<text x="64" y="100" class="kick">C · POSIX THREADS · TCP SOCKETS</text>
<text x="64" y="166" class="title">MINI-KV SERVER</text>
<text x="64" y="208" class="tag">Many clients, one hash table, no corruption</text>
<g transform="translate(810,50)"><rect x="0" y="0" width="340" height="180" rx="12" fill="#020617" stroke="#ffffff" stroke-opacity=".18"/><circle cx="18" cy="16" r="5" fill="#EF4444"/><circle cx="34" cy="16" r="5" fill="#F59E0B"/><circle cx="50" cy="16" r="5" fill="#22C55E"/><text x="18" y="54" class="term" text-anchor="start" fill="#E5E7EB">&gt; PUT color red</text><text x="18" y="80" class="term" text-anchor="start" fill="#4ADE80">OK</text><text x="18" y="106" class="term" text-anchor="start" fill="#E5E7EB">&gt; GET color</text><text x="18" y="132" class="term" text-anchor="start" fill="#4ADE80">VALUE red</text><text x="18" y="158" class="term" text-anchor="start" fill="#E5E7EB">&gt; STATS</text><rect x="92" y="144" width="9" height="17" fill="#4ADE80" class="cur"/></g>
</svg>
